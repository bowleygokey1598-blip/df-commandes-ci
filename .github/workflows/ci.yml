name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # Versions : https://github.com/actions/checkout/releases

      - name: Configurer Node.js
        uses: actions/setup-node@v4 # Versions : https://github.com/actions/setup-node/releases
        with:
          node-version: 24
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Lancer le lint
        run: npm run lint -- --max-warnings=0

      - name: Lancer les tests
        run: npm test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complet
        uses: actions/checkout@v4 # Versions : https://github.com/actions/checkout/releases
        with:
          fetch-depth: 0

      - name: Installer gitleaks
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          sudo tar -xz -C /usr/local/bin -f /tmp/gitleaks.tar.gz gitleaks

      - name: Analyser les secrets
        run: gitleaks git -v --no-banner --redact .